[tool.poetry]
name = "ci-fastapi"
version = "1.0.0"
description = "Atividade de integracao continua com FastAPI, Poetry e pytest"
authors = ["Natanael"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "0.115.12"
pydantic = "2.11.4"
uvicorn = "0.34.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.5"
httpx = "0.28.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
